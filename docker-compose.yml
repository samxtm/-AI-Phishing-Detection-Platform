services:
  phishing-detection:
    build: .
    image: ${DOCKER_USERNAME:-local}/phishing-detection-app:latest
    container_name: phishing-detection-platform
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist SQLite database on the host machine across container restarts
      - ./database:/app/database
    restart: unless-stopped

